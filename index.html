
<html lang="pt-br"> 
<head>
  <title>BBMP</title>
  <link rel="icon" href="Bahia.png"> 
  <meta charset="UTF-8">
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-top: 30px;
            font-size: 3rem; /* Título bem grande */
        }

        /* Container dos GIFs (Flexbox centralizado) */
        .container-gifs {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px; /* Espaço maior entre os GIFs */
            margin-top: 40px;
        }

        .container-gifs img {
            width: 350px; /* Tamanho harmonioso */
            height: auto;
            border: 8px solid white; /* Borda branca para dar destaque */
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); /* Sombra suave para dar profundidade */
        }

        /* Cores do texto */
        .vermelho { color: red; }
        .azul { color: blue; }
    </style>
</head>
<body>

    <h1>
        <span class="vermelho">B</span><span class="azul">o</span><span class="vermelho">r</span><span class="azul">a</span> 
        <span class="vermelho">B</span><span class="azul">a</span><span class="vermelho">h</span><span class="azul">e</span><span class="vermelho">a</span> 
        <span class="azul">M</span><span class="vermelho">i</span><span class="azul">n</span><span class="vermelho">h</span><span class="azul">a</span> 
        <span class="vermelho">P</span><span class="azul">o</span><span class="vermelho">r</span><span class="azul">r</span><span class="vermelho">a</span>
    </h1>

    <div class="container-gifs">
        <img src="https://media1.tenor.com/m/4H9DKFAp2UkAAAAd/ecbahia-bahia.gif" alt="GIF Bahia 1">
        <img src="https://media1.tenor.com/m/sLAd5s3Pv2wAAAAC/ec-bahia-caio-alexandre.gif" alt="GIF Bahia 2">
    </div>

</body>
</html>
